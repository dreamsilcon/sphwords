<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>自测背单词 · SPHWords</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/drill.css" />
</head>
<body class="drill-body">
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html">SPH<span>Words</span></a>
      <div class="nav-meta"><a href="index.html">目录</a> · <a href="compare.html">辨析</a> · 自测</div>
    </div>
  </header>

  <main class="drill-app">
    <section class="drill-toolbar">
      <label class="drill-field">
        <span>刷词来源</span>
        <select id="drill-source">
          <option value="chapter">按章节</option>
          <option value="list">从不熟列表</option>
        </select>
      </label>

      <div id="source-chapter-fields">
        <label class="drill-field">
          <span>章节范围</span>
          <select id="drill-chapter">
            <option value="all">全部章节</option>
          </select>
        </label>
        <label class="drill-check">
          <input type="checkbox" id="drill-related" checked />
          <span>含词条内拓展词（易混/对比等）</span>
        </label>
        <label class="drill-check">
          <input type="checkbox" id="drill-extra" />
          <span>只要带辨析/易混笔记的条目</span>
        </label>
      </div>

      <div id="source-list-fields" hidden>
        <label class="drill-field">
          <span>开刷哪一份不熟列表</span>
          <select id="drill-list-source"></select>
        </label>
      </div>

      <label class="drill-field">
        <span>点「不熟」写入哪一份列表</span>
        <select id="drill-list-target"></select>
      </label>

      <div class="drill-list-actions">
        <button type="button" class="drill-btn ghost" id="btn-reshuffle">重洗牌</button>
        <button type="button" class="drill-btn ghost" id="btn-new-list">新建列表</button>
        <button type="button" class="drill-btn ghost" id="btn-rename-list">重命名</button>
        <button type="button" class="drill-btn ghost" id="btn-delete-list">删除列表</button>
      </div>
    </section>

    <div class="drill-status">
      <span id="drill-progress">0 / 0</span>
      <span id="drill-meta"></span>
    </div>

    <section class="drill-face" id="drill-face" hidden>
      <p class="drill-kind" id="drill-kind" hidden>拓展词</p>
      <div class="drill-word-row">
        <p class="drill-word" id="drill-word"></p>
        <button type="button" class="drill-speak" id="btn-speak" aria-label="朗读单词" title="朗读">读</button>
      </div>
      <p class="drill-ipa" id="drill-ipa" hidden></p>
      <p class="drill-sense is-prompt" id="drill-sense">想一想这个词的意思</p>
      <p class="drill-tap-hint">点卡片揭晓释义并朗读；不用再点进详情</p>
    </section>

    <p class="drill-empty" id="drill-empty" hidden>这个范围内没有词，换个章节或列表试试。</p>

    <section class="drill-actions" id="drill-actions" hidden>
      <button type="button" class="drill-btn primary" id="btn-reveal">揭晓释义</button>
      <button type="button" class="drill-btn good" id="btn-know" hidden>认识</button>
      <button type="button" class="drill-btn bad" id="btn-unknown" hidden>不熟</button>
    </section>

    <section class="drill-lists" id="drill-lists">
      <div class="drill-lists-head">
        <h2>不熟词表</h2>
        <label class="drill-field inline">
          <span>查看</span>
          <select id="drill-list-view"></select>
        </label>
      </div>
      <p class="drill-lists-blurb" id="drill-list-count">共 0 词 · 保存在本机浏览器</p>
      <div class="drill-table-wrap">
        <table class="drill-table" id="drill-table">
          <thead>
            <tr>
              <th>单词</th>
              <th>释义</th>
              <th>章</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="drill-table-body"></tbody>
        </table>
      </div>
      <p class="drill-lists-empty" id="drill-table-empty" hidden>这份列表还是空的。刷词时点「不熟」就会加进来。</p>
      <button type="button" class="drill-btn primary" id="btn-start-view-list">用正在查看的列表开刷</button>
    </section>

    <section class="drill-help">
      <h2>怎么用</h2>
      <p>正面只出英文词，你先自己想意思，再揭晓看核心释义——核心词和词条里的拓展/易混/对比词都会出。</p>
      <p>点「不熟」写入选定列表；可自建多份列表。下次可直接从不熟列表开刷。</p>
      <p>在不熟列表模式点「认识」，会从该列表移除。数据保存在本机浏览器。</p>
    </section>
  </main>

  <footer class="site-footer"><div class="wrap">SPHWords 自测 · 数据来自课堂笔记词头</div></footer>
  <script src="assets/drill.js" defer></script>
</body>
</html>
