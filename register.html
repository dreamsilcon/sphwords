<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注册 · SPHWords</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/auth.css" />
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html">SPH<span>Words</span></a>
      <div class="nav-meta"><a href="login.html">登录</a></div>
    </div>
  </header>

  <main class="auth-wrap">
    <h1>注册账号</h1>
    <p class="sub">使用任意有效邮箱注册。验证方式为邮件中的<strong>链接</strong>（开发模式会直接显示链接）。</p>
    <div class="auth-panel">
      <form id="form">
        <label for="email">邮箱</label>
        <input id="email" type="email" placeholder="you@example.com" required autocomplete="email" />

        <label for="password">密码（至少 8 位）</label>
        <input id="password" type="password" required minlength="8" autocomplete="new-password" />

        <label for="captcha">图形验证码</label>
        <div class="auth-captcha">
          <input id="captcha" type="text" placeholder="输入右图字符" required maxlength="8" autocomplete="off" />
          <div class="auth-captcha-box" id="captchaBox" title="点击刷新"></div>
        </div>

        <button class="auth-submit" type="submit" id="submitBtn">注册并发送验证邮件</button>
      </form>
      <div class="auth-status" id="status"></div>
    </div>
    <p class="auth-links"><a href="login.html">已有账号？登录</a><a href="index.html">回首页</a></p>
  </main>

  <script src="assets/site-base.js"></script>
  <script src="assets/auth-forms.js"></script>
  <script>
    const state = { captchaId: "" };
    const statusEl = document.getElementById("status");
    const box = document.getElementById("captchaBox");
    SphAuthForms.bindCaptcha(box, state).catch(() => SphAuthForms.setStatus(statusEl, "验证码加载失败", "err"));

    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      SphAuthForms.setStatus(statusEl, "提交中…");
      try {
        const res = await fetch(sphUrl("/api/auth/register"), {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
            captcha_id: state.captchaId,
            captcha_answer: document.getElementById("captcha").value.trim(),
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.detail || "注册失败");
        }
        if (data.verify_link) {
          const wrap = document.createElement("div");
          wrap.appendChild(document.createTextNode(data.message + " "));
          const a = document.createElement("a");
          a.href = data.verify_link;
          a.textContent = "点击完成验证";
          wrap.appendChild(a);
          SphAuthForms.setStatus(statusEl, wrap, "ok");
        } else {
          SphAuthForms.setStatus(statusEl, data.message || "注册成功", "ok");
        }
      } catch (err) {
        SphAuthForms.setStatus(statusEl, err.message || String(err), "err");
        document.getElementById("captcha").value = "";
        SphAuthForms.loadCaptcha(box, state).catch(() => {});
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
