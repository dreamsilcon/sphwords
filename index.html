<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPHWords · 宋鹏昊单词</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/auth.css" />
</head>
<body class="hub-body">
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html">SPH<span>Words</span></a>
      <nav class="site-nav" data-site-nav data-active="home" aria-label="主导航"></nav>
    </div>
  </header>

  <main class="hub">
    <p class="hub-brand">SPHWords</p>
    <h1 class="hub-title">选一个模块开始</h1>
    <p class="hub-sub" id="hub-sub">课堂笔记 · 自测背词 · 易混辨析</p>

    <div class="hub-modules">
      <a class="hub-tile" href="notes.html">
        <span class="hub-tile-kicker">Module 01</span>
        <span class="hub-tile-title">课堂笔记</span>
        <span class="hub-tile-desc">按章浏览原始笔记、音标与例句</span>
      </a>
      <a class="hub-tile" href="drill.html">
        <span class="hub-tile-kicker">Module 02</span>
        <span class="hub-tile-title">自测背词</span>
        <span class="hub-tile-desc">出英文词、揭晓释义，不熟写入错题本</span>
      </a>
      <a class="hub-tile" href="compare.html">
        <span class="hub-tile-kicker">Module 03</span>
        <span class="hub-tile-title">易混辨析</span>
        <span class="hub-tile-desc">对比表、易混词与词源记忆汇总</span>
      </a>
    </div>

    <p class="hub-account" id="hub-account"></p>
  </main>

  <footer class="site-footer"><div class="wrap">SPHWords · 登录后错题本可跨设备同步</div></footer>
  <script src="assets/site-base.js"></script>
  <script src="assets/site-nav.js"></script>
  <script>
    (async () => {
      const box = document.getElementById("hub-account");
      const sub = document.getElementById("hub-sub");
      try {
        const res = await fetch(sphUrl("/api/auth/me"), { credentials: "same-origin" });
        const me = await res.json();
        if (me.authenticated) {
          sub.textContent = `已登录 ${me.email}`;
          box.innerHTML = `<a href="account.html">我的账号 / 错题本</a>`;
        } else {
          box.innerHTML = `<a href="login.html?next=index.html">登录</a> 后错题本可同步 · <a href="register.html">注册</a>`;
        }
      } catch {
        box.innerHTML = `<a href="login.html?next=index.html">登录</a> · <a href="register.html">注册</a>`;
      }
    })();
  </script>
</body>
</html>
